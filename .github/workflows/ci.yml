name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: cp .env.example .env

      - name: Bootstrap and migrate database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms
          DATABASE_URL_SESSION: postgresql://postgres:postgres@localhost:5432/lms
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/lms" -f scripts/db-bootstrap.sql
          pnpm db:migrate
          pnpm db:seed

      - name: Run quality gates (verify)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms
          DATABASE_URL_SESSION: postgresql://postgres:postgres@localhost:5432/lms
        run: pnpm verify

      - name: Build application
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms
          DATABASE_URL_SESSION: postgresql://postgres:postgres@localhost:5432/lms
        run: pnpm build
